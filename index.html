<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation Playground</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    label { display: block; margin-top: 10px; }
    input, select { padding: 6px; margin-top: 4px; width: 250px; }
    button { margin-top: 15px; padding: 8px 16px; }
    .output { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Form Validation Playground</h1>
  <form id="formPlayground">
    <label>Age (18–60): <input type="number" id="age" required></label>
    <label>Email: <input type="email" id="email" required></label>
    <label>Password: <input type="password" id="password" required></label>
    <label>Payment Method:
      <select id="payment">
        <option value="">--Choose--</option>
        <option value="card">Credit Card</option>
        <option value="paypal">PayPal</option>
        <option value="cod">Cash on Delivery</option>
      </select>
    </label>
    <label>Shipping:
      <select id="shipping">
        <option value="">--Choose--</option>
        <option value="standard">Standard</option>
        <option value="express">Express</option>
      </select>
    </label>
    <button type="submit">Submit</button>
  </form>
  <div class="output" id="output"></div>

  <script>
    document.getElementById('formPlayground').addEventListener('submit', function(e){
      e.preventDefault();
      const age = parseInt(document.getElementById('age').value,10);
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const payment = document.getElementById('payment').value;
      const shipping = document.getElementById('shipping').value;
      let message = "";

      if(age < 18 || age > 60) message += "❌ Age out of range.<br>";
      if(!email.includes("@")) message += "❌ Invalid email.<br>";
      if(password.length < 6 || !/\d/.test(password)) message += "❌ Weak password.<br>";
      if(payment==="cod" && shipping==="express") message += "❌ COD not allowed with Express.<br>";

      // Intentional defect
      let plan = "Enterprise";
      if(plan==="Enterprise") plan="Pro";

      if(message==="") message = "✅ Valid submission!<br>Plan chosen: " + plan;
      document.getElementById('output').innerHTML = message;
    });
  </script>
</body>
</html>
