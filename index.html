<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Practice Page</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #2c3e50; }
    #results { margin-top: 20px; }
    .result-item { margin: 8px 0; padding: 10px; border: 1px solid #ccc; }
    .highlight { background-color: #f9f9a9; }
  </style>
  <script>
    function performSearch(event) {
      event.preventDefault();
      const query = document.getElementById("searchBox").value;
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      if (!query) {
        resultsDiv.innerHTML = "<p>Please enter a search term.</p>";
        return;
      }

      // Simulated search results
      const sampleResults = [
        "Selenium WebDriver tutorial",
        "Selenium Grid setup guide",
        "Selenium IDE basics",
        "Advanced Selenium automation techniques",
        "Handling alerts and popups in Selenium"
      ];

      sampleResults.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "result-item";
        div.innerHTML = `<a href="result${index+1}.html">${item}</a>`;
        if (item.toLowerCase().includes(query.toLowerCase())) {
          div.classList.add("highlight");
        }
        resultsDiv.appendChild(div);
      });
    }
  </script>
</head>
<body>
  <h1>Search Page</h1>

  <form onsubmit="performSearch(event)">
    <label for="searchBox">Enter search term:</label><br>
    <input type="text" id="searchBox" name="searchBox"><br><br>
    <button type="submit">Search</button>
  </form>

  <div id="results"></div>

  <section>
    <h2>Navigation</h2>
    <a href="index.html">Home</a><br>
    <a href="login.html">Login</a><br>
    <a href="register.html">Register</a><br>
    <a href="dashboard.html">Dashboard</a>
  </section>
</body>
</html>
