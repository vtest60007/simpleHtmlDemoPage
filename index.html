<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard Practice Page</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #2c3e50; }
    nav a {
      margin: 10px;
      padding: 8px 12px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }
    nav a:hover { background-color: #2980b9; }
    section { margin-top: 30px; }
    table, th, td { border: 1px solid #333; border-collapse: collapse; padding: 8px; }
    #notification { color: green; font-weight: bold; }
  </style>
  <script>
    function showNotification() {
      document.getElementById("notification").innerText = "New notification received!";
    }
    function updateProfile() {
      document.getElementById("profileStatus").innerText = "Profile updated successfully!";
    }
  </script>
</head>
<body>
  <h1>Welcome to Your Dashboard</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Logout</a>
    <a href="register.html">Register</a>
    <a href="forgot.html">Forgot Password</a>
    <a href="playground.html">Playground</a>
  </nav>

  <section>
    <h2>User Profile</h2>
    <form onsubmit="event.preventDefault(); updateProfile();">
      <label for="fullname">Full Name:</label><br>
      <input type="text" id="fullname" name="fullname" value="John Doe"><br><br>

      <label for="email">Email:</label><br>
      <input type="text" id="email" name="email" value="john@example.com"><br><br>

      <button type="submit">Update Profile</button>
    </form>
    <p id="profileStatus"></p>
  </section>

  <section>
    <h2>Notifications</h2>
    <button onclick="showNotification()">Check Notifications</button>
    <p id="notification"></p>
  </section>

  <section>
    <h2>Recent Activity</h2>
    <table>
      <tr><th>Date</th><th>Action</th></tr>
      <tr><td>2026-02-18</td><td>Logged in</td></tr>
      <tr><td>2026-02-17</td><td>Updated profile</td></tr>
      <tr><td>2026-02-16</td><td>Registered new account</td></tr>
    </table>
  </section>
</body>
</html>
